name: CI

on:
  push:
    # This repo's branch is `main`. It said `master` until 2026-07-28, which meant
    # no push ever triggered CI: every green run came from a PR or a manual
    # dispatch, and a direct push to main went unverified.
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The tests replay recorded upstream responses and fail on any
      # unexpected network call, so CI never depends on GoPlus or DexScreener
      # being up, or on a token's live liquidity.
      - name: Test
        run: pnpm test

      # The fulfilment watcher ships to production too, and every incident this
      # service has had originated in it: a wrong-chain delivery, and a delivery
      # message that demanded a second payment. It was unguarded until 2026-08-03
      # because it is Python and the test job was Node only.
      #
      # Offline like the Node suite: the watcher reaches outside through a single
      # `run()`, which the tests stub, and an unstubbed call raises rather than
      # quietly hitting the network.
      - name: Test the fulfilment watcher
        # Warnings are errors. A leaked file handle or an unclosed socket in a
        # test is the same habit that, in the watcher, runs unattended on a
        # timer forever. Without this the warnings scroll past and accumulate.
        run: python3 -W error::ResourceWarning -m unittest discover -s ops -p 'test_*.py' -v

      # /verify renders JSON an attacker chooses, and its defence is that every
      # value goes in through textContent rather than innerHTML. No string
      # search over the served HTML can tell that apart from the innerHTML
      # version that shipped before: both produce the same bytes, and only a
      # browser decides whether they execute. So one runs here.
      #
      # Kept out of `pnpm test` so the everyday loop needs no browser, which
      # means this step is the only thing keeping it alive. Do not drop it to
      # save a minute.
      - name: Install a browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the verifier in a browser
        run: pnpm test:browser

      - name: Build the server bundle
        run: pnpm build:server

      # A generated file that differs from its source means someone edited the
      # output, or forgot to rebuild before committing.
      - name: Generated assets are up to date
        run: |
          pnpm build:assets && pnpm build:client
          if ! git diff --quiet -- src/generated; then
            echo "src/generated is stale. Run 'pnpm build:client' and commit."
            git --no-pager diff --stat -- src/generated
            exit 1
          fi

      # The report is a document people print and share. It must never grow a
      # dependency on anything outside itself.
      - name: The report stays self-contained
        run: |
          if grep -n 'gsap\|lenis\|@font-face\|<script' src/dossier/render.ts; then
            echo 'The report renderer must not load scripts or webfonts.'
            exit 1
          fi

      - name: Smoke the built bundle
        env:
          DEV_SKIP_PAYMENT: "1"
          PORT: "8799"
        run: |
          node dist/server.mjs &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8799/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8799/health" >/dev/null
          curl -fsS "http://127.0.0.1:8799/" | grep -q 'hero-viz'
          font=$(curl -fsS "http://127.0.0.1:8799/" | grep -o '/f/[a-z-]*-[a-f0-9]*\.woff2' | head -1)
          curl -fsS "http://127.0.0.1:8799$font" >/dev/null
          echo "built bundle serves the landing page and its fonts"
