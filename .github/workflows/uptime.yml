name: Uptime

# Runs from GitHub, not from the box, because a monitor that lives on the host
# it watches cannot report the host being down.
#
# It checks the *paid* path, not just /health. On 27 July the process answered
# /health with 200 for two hours while every paid call returned 503, because the
# facilitator was rejecting our credentials. A health check alone would have
# reported everything fine the entire time.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://dossier.rouma.xyz
    steps:
      - name: The free surface answers
        run: |
          set -euo pipefail
          for path in / /health /info /dossier/sample; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 "$BASE$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code, expected 200"; exit 1; }
          done

      - name: The paid path still demands payment
        run: |
          set -euo pipefail
          # 402 means the payment layer is genuinely up. 503 is the shape an
          # unreachable or rejecting facilitator takes, and is the failure that
          # went unnoticed for two hours.
          for method in GET POST; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 -X $method "$BASE/dossier")
            echo "  $method /dossier -> $code"
            if [ "$code" = "503" ]; then
              echo "::error::$method /dossier returned 503: the payment layer is down, no one can buy"
              exit 1
            fi
            [ "$code" = "402" ] || { echo "::error::$method /dossier returned $code, expected 402"; exit 1; }
          done

      - name: Rate limiting is actually enforcing
        run: |
          set -euo pipefail
          # The limiter used to default to observe, so a deploy that lost
          # RATE_LIMIT_MODE throttled nobody and looked identical from outside.
          # The default is enforce now; this asserts nothing has re-selected
          # observe in production.
          m=$(curl -sS --max-time 30 "$BASE/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rateLimit'))")
          echo "  rateLimit -> $m"
          [ "$m" = "enforce" ] || { echo "::error::rate limiting is '$m', not enforce"; exit 1; }

      - name: The fulfilment watcher is still alive
        run: |
          set -euo pipefail
          # The timer runs every 120s. Anything past ten minutes means it has
          # stopped ticking: task-mode buyers who ask a question get no answer,
          # and every other check on this page stays green while that happens.
          age=$(curl -sS --max-time 30 "$BASE/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('fulfilmentAgeSeconds'))")
          echo "  fulfilmentAgeSeconds -> $age"
          if [ "$age" = "None" ]; then
            echo "::error::the fulfilment watcher has no heartbeat: it has not run since the file was last removed"
            exit 1
          fi
          [ "$age" -lt 600 ] || { echo "::error::the fulfilment watcher last ticked ${age}s ago; the timer is not running"; exit 1; }

      - name: No job is wedged, and our own identity still checks out
        run: |
          set -euo pipefail
          # The step above proves the watcher is *alive*, which is the question
          # nobody needed answered. A watcher ticking every 120s over a job it
          # asked about an hour ago and can no longer read passes it exactly like
          # an idle one does. That is the shape of the 2026-08-03 deadlock, and
          # the only reason anyone found it was by opening the state file.
          #
          # The threshold is deliberately loose. A job is legitimately open while
          # the watcher holds 240s for the buyer's own replay, and then for as
          # long as a buyer reasonably takes to answer a question. An hour is not
          # a buyer thinking; it is nobody coming.
          h=$(curl -sS --max-time 30 "$BASE/health")
          oldest=$(echo "$h" | python3 -c "import json,sys; print(json.load(sys.stdin).get('oldestOpenJobSeconds'))")
          echo "  oldestOpenJobSeconds -> $oldest"
          if [ "$oldest" != "None" ] && [ "$oldest" -gt 3600 ]; then
            echo "::error::a job has been outstanding for ${oldest}s: a buyer has paid and is waiting"
            exit 1
          fi
          # The watcher decides which messages in a conversation belong to the
          # buyer by comparing against a cached inbox id. If ours ever stops
          # matching, replies are misattributed and nothing else says so.
          mismatch=$(echo "$h" | python3 -c "import json,sys; print(json.load(sys.stdin).get('inboxMismatch'))")
          echo "  inboxMismatch -> $mismatch"
          [ "$mismatch" != "True" ] || { echo "::error::our cached XMTP inbox id no longer matches the conversations; buyer replies may be misattributed"; exit 1; }

      - name: The service reports its own payment layer as ready
        run: |
          set -euo pipefail
          state=$(curl -sS --max-time 30 "$BASE/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('paymentLayer'))")
          echo "  paymentLayer -> $state"
          [ "$state" = "ready" ] || { echo "::error::payment layer is '$state', not ready"; exit 1; }

      - name: The challenge is still valid and priced correctly
        run: |
          set -euo pipefail
          curl -sS -D - -o /dev/null --max-time 45 -X POST "$BASE/dossier" \
            | tr -d '\r' | grep -i '^payment-required:' | sed 's/^[^:]*: *//' > hdr.b64
          [ -s hdr.b64 ] || { echo "::error::no PAYMENT-REQUIRED header on the paid route"; exit 1; }
          base64 -d < hdr.b64 > challenge.json
          python3 - challenge.json <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          a = c["accepts"][0]
          url = c["resource"]["url"]
          assert url.startswith("https://"), f"resource url is not https: {url}"
          assert a["network"] == "eip155:196", f"wrong network: {a['network']}"
          # 10000 = 0.01 USD₮0 at 6 decimals. Dropped from 500000 on 2026-07-28.
          # This must match the listing fee on OKX service 36013, or a marketplace
          # buyer's task budget will not cover the challenge.
          assert a["amount"] == "10000", f"price changed: {a['amount']}"
          assert a["payTo"].lower() == "0x51c25782af63381056cd1c3c59c0544628d67697", "payout address changed"
          schema = c["extensions"]["outputSchema"]["input"]["schema"]
          assert schema["required"] == ["tokenAddress"], "the input contract lost its required field"
          print("  challenge ok:", a["amount"], a["network"], "| required:", schema["required"])
          PY

      - name: The challenge still fits in a proxy's header buffer
        run: |
          set -euo pipefail
          # The challenge is a base64 response header. A proxy that caps headers
          # (4KB is common) turns an oversized one into a 502 on every 402, so the
          # paid route fails closed for everyone with no warning beforehand. The
          # unit test guards the schema we author; this guards what actually goes
          # out, including anything the SDK adds.
          bytes=$(wc -c < hdr.b64 | tr -d ' ')
          echo "  PAYMENT-REQUIRED value: ${bytes}B"
          if [ "$bytes" -gt 3072 ]; then
            echo "::error::challenge header is ${bytes}B, past the 3072B budget: a 4KB proxy will 502 every 402"
            exit 1
          fi
          # An if, not `[ ... ] && echo`: under `set -e` that idiom returns
          # non-zero when the test is false, which fails the step for the
          # healthy case. This workflow has been bitten by a shell subtlety once
          # already, when a heredoc and a pipe both consumed stdin.
          if [ "$bytes" -gt 2560 ]; then
            echo "::warning::challenge header is ${bytes}B, approaching the 3072B budget"
          fi
          echo "  within budget"

      - name: Reports are still signed with the published key
        run: |
          set -euo pipefail
          key=$(curl -sS --max-time 30 "$BASE/.well-known/dossier-signing-key.json" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('publicKey') or '')")
          echo "  published key -> ${key:0:16}…"
          [ -n "$key" ] || { echo "::error::no signing key published; reports would go out unsigned"; exit 1; }

      - name: The sample report is a complete document, not a broken one
        run: |
          set -euo pipefail
          # Everything above this line checks plumbing: the payment layer, the
          # challenge, the key, the watcher. None of it reads the product.
          #
          # Every content defect this service has shipped was found by an outside
          # party or by someone opening a report by hand, never by CI: an RPC hash
          # missing from the attestation, a pair age that drifted on every call, a
          # lock printed as "0%" when none had been established, and an LP row that
          # rendered blank because "<1%" went into the HTML unescaped. That last one
          # shipped inside a commit fixing the one before it, with a green suite.
          #
          # /dossier/sample is a real report, built live from real sources, and free.
          curl -sS --max-time 60 "$BASE/dossier/sample" -o sample.html
          python3 - sample.html <<'PY'
          import re, sys
          h = open(sys.argv[1], encoding="utf-8").read()

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          # A report missing a row is not a smaller report, it is a different product.
          for name in ("Sellability", "Contract control", "Liquidity",
                       "Market activity", "Holder concentration"):
              if f"</span>{name}</td>" not in h:
                  fail(f"the sample report is missing its '{name}' check")

          # Every labelled field must carry a value. Asserted on the shape rather
          # than on the one field that broke, so the next one is caught too.
          rows = re.findall(r'<span class="lab">([^<]*)</span><span[^>]*>([^<]*)</span>', h)
          if len(rows) < 14:
              fail(f"only {len(rows)} labelled fields in the sample; the document is truncated")
          for label, value in rows:
              if not value.strip():
                  fail(f"'{label}' rendered with no value at all")

          # An unestablished LP lock must never print as a measured zero. A paying
          # buyer found this one: it read 0 for every blue chip, because the source
          # only marks lockers it recognises.
          lock = dict(rows).get("LP locked (main pool)")
          if lock is None:
              fail("the LP lock row is gone; a buyer complaint was closed by making this explicit")
          if re.fullmatch(r"0(\.0+)?%", lock.strip()):
              fail(f"LP lock reported as a measured zero ({lock}); absence renders '—', never 0%")
          if re.search(r"\b0(\.0+)?% of the main pool", h):
              fail("the verdict line claims '0% of the main pool's LP locked'")

          # Unsigned, the report is a PDF with opinions in it.
          m = re.search(r"Payload sha256</span><span[^>]*>([0-9a-f]{64})</span>", h)
          if not m:
              fail("no 64-hex payload sha256 in the sample: the report is not attesting to itself")
          for label in ("Signature", "Public key"):
              v = re.search(rf"{label}</span><span[^>]*>([^<]*)</span>", h)
              if not v or len(v.group(1).strip()) < 32:
                  fail(f"the sample carries no usable {label.lower()}")

          print(f"  sample ok: 5 checks, {len(rows)} fields all populated, "
                f"LP lock '{lock}', payload {m.group(1)[:16]}…")
          PY

      - name: The service still refuses to guess
        run: |
          set -euo pipefail
          # The claim the whole entry rests on: sources are tri-state, and an
          # absence is never dressed up as knowledge. A token nothing has heard of
          # must come back not_found with its fields listed as unavailable, not
          # "ok" with confident nulls behind it.
          known="0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82"
          nowhere="0x1234567890abcdef1234567890abcdef12345678"
          curl -sS --max-time 45 "$BASE/dossier/preflight?tokenAddress=$known&chain=bsc" -o known.json
          curl -sS --max-time 45 "$BASE/dossier/preflight?tokenAddress=$nowhere&chain=bsc" -o nowhere.json
          python3 - known.json nowhere.json <<'PY'
          import json, sys
          known, nowhere = (json.load(open(p)) for p in sys.argv[1:3])

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          if known["sources"] != {"goplus": "ok", "dexscreener": "ok", "rpc": "ok"}:
              fail(f"a fully covered token lost a source: {known['sources']}")
          if known["expectedCoverage"] != 1 or not known["reportAvailable"]:
              fail(f"a fully covered token no longer reports full coverage: {known['expectedCoverage']}")

          if nowhere["sources"].get("goplus") != "not_found" or nowhere["sources"].get("dexscreener") != "not_found":
              fail(f"an unknown token did not come back not_found: {nowhere['sources']}")
          if nowhere["expectedCoverage"] >= 1:
              fail("an unknown token is claiming full coverage")
          for f in ("priceUsd", "liquidityUsd", "heuristicSizeCap"):
              if f in nowhere.get("fieldsAvailable", []):
                  fail(f"an unknown token claims it can supply {f}")
          print(f"  known: coverage {known['expectedCoverage']} | "
                f"unknown: coverage {nowhere['expectedCoverage']}, "
                f"{len(nowhere['fieldsUnavailable'])} fields declared unavailable")
          PY

      - name: A paid report carries its evidence
        env:
          INTERNAL_KEY: ${{ secrets.INTERNAL_KEY }}
        run: |
          set -euo pipefail
          # What the free surfaces cannot reach: the per-source hashes, which the
          # rendered HTML does not carry.
          #
          # This deliberately does NOT assert determinism. Determinism is "the same
          # token and the same data give the same report", and two live calls are
          # not the same data: a first draft of this step compared two responses
          # and failed because a DEX pool moved by $1,600 in the two seconds
          # between them. A monitor that fires on a healthy service every fifteen
          # minutes is the same defect as a risk check that warns on every token.
          # Determinism is tested against recorded fixtures in CI, which is the
          # only place the inputs can actually be held still.
          #
          # What two calls *can* prove is that the shape is stable and that every
          # source which answered attested what it answered.
          #
          # Skipped loudly rather than silently: a check that quietly does nothing
          # is the failure mode it exists to prevent.
          if [ -z "${INTERNAL_KEY:-}" ]; then
            echo "::warning::no INTERNAL_KEY secret set: per-source provenance is UNGUARDED. Add the secret to enable this check."
            exit 0
          fi
          body='{"tokenAddress":"0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82","chain":"bsc","format":"json"}'
          for i in 1 2; do
            curl -sS --max-time 60 -X POST "$BASE/dossier" \
              -H "x-internal-key: $INTERNAL_KEY" -H 'content-type: application/json' \
              -d "$body" -o "run$i.json"
          done
          python3 - run1.json run2.json <<'PY'
          import json, re, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          # Every source that answered must carry the hash of what it answered, or
          # the attestation covers a claim nobody can re-check. The RPC hash was
          # computed correctly, unit tested, and then never copied into the payload,
          # so the signed report said sha256=MISSING while the suite stayed green.
          #
          # Both responses, not just the first: a guard that reads one of two
          # fetched documents is half a guard.
          for label, resp in (("run 1", a), ("run 2", b)):
              obs = resp["attestation"]["payload"].get("observations") or []
              if not obs:
                  fail(f"{label}: the attestation carries no observations at all")
              for o in obs:
                  if o.get("status") == "ok" and not o.get("responseSha256"):
                      fail(f"{label}: source '{o.get('source')}' answered but attested no response hash")
              if resp["security"].get("lpLockedPct") == 0:
                  fail(f"{label}: lpLockedPct is 0; an unestablished lock must be absent, not zero")
              for field in ("payloadSha256", "signature", "publicKey"):
                  if not resp["attestation"].get(field):
                      fail(f"{label}: the report went out without a {field}")

          # The shape must not move even though the numbers may. A field that
          # silently stops being emitted is exactly how the RPC hash went missing,
          # and values alone cannot show it.
          def paths(x, p=""):
              if isinstance(x, dict):
                  for k, v in x.items():
                      yield from paths(v, f"{p}.{k}")
              elif isinstance(x, list):
                  for i, v in enumerate(x):
                      yield from paths(v, f"{p}[*]")
              else:
                  yield p
          # Only meaningful when both calls saw the same upstreams. GoPlus rate
          # limits, and a source that answers once and not the next second changes
          # the shape legitimately: fewer fields, no hash for the source that did
          # not answer. Comparing across that would turn an upstream hiccup into a
          # red monitor, which is how a check stops being believed.
          def statuses(resp):
              return {o["source"]: o.get("status")
                      for o in resp["attestation"]["payload"].get("observations") or []}
          sa, sb = statuses(a), statuses(b)
          if sa != sb:
              print(f"::warning::upstream coverage changed between the two calls "
                    f"({sa} then {sb}); skipping the shape comparison")
          else:
              pa, pb = set(paths(a)), set(paths(b))
              if pa != pb:
                  for p in sorted(pa ^ pb)[:6]:
                      fail(f"the response shape is unstable: {p} appears in only one of two identical requests")

          names = ", ".join(f"{o['source']}={(o.get('responseSha256') or '')[:8]}…"
                            for o in a["attestation"]["payload"]["observations"])
          print(f"  evidence ok: {len(set(paths(a)))} fields | {names}")
          PY

      - name: TLS certificate is not about to expire
        run: |
          set -euo pipefail
          end=$(echo | openssl s_client -servername dossier.rouma.xyz -connect dossier.rouma.xyz:443 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "  certificate expires in $days days ($end)"
          [ "$days" -gt 10 ] || { echo "::error::certificate expires in $days days"; exit 1; }
